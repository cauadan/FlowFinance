name: Supabase Keep Alive

on:
  schedule:
    # Executa toda terça e sexta-feira às 06:00 UTC
    - cron: '0 6 * * 2,5'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/User?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
